name: xv6-ci

on:
  push:
    branches: [main, "feature/**", "infra/**", evaluation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      matrix:
        cpus: [1, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install RISC-V and QEMU tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu \
            qemu-system-misc \
            make \
            shellcheck \
            expect

      - name: Check host scripts
        run: shellcheck scripts/*.sh

      - name: Build and boot xv6
        env:
          CPUS: ${{ matrix.cpus }}
          XV6_OUTPUT: /tmp/xv6-smoke.txt
        run: scripts/smoke-test.sh

      - name: Upload QEMU log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-log-cpu${{ matrix.cpus }}
          path: /tmp/xv6-smoke.txt
